# Packages desktop/ for macOS (arm64 dmg and zip) and Windows (x64 NSIS).
# Unsigned on both, so no auto-update: new versions come from GitHub Releases.
appId: com.sthyra.rendertofilm
productName: Render to Film
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - main/dist/**
  - preload/dist/**
  - platform/**/*.js
  - platform/**/*.css
  - platform/bay/package.json
  - platform/bay-react/package.json
  - package.json
extraResources:
  - from: platform/assets
    to: assets
# Native code and the two bundled binaries must exist as real files on disk.
asarUnpack:
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"
  - "**/node_modules/@higgsfield/cli/vendor/**"
  - "**/node_modules/ffmpeg-static/**"
npmRebuild: false
publish: null
afterPack: scripts/after-pack.cjs
mac:
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  category: public.app-category.video
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
